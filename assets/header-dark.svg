<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Imad Lembachar - Full-stack and machine learning engineer">
  <title>Imad Lembachar - Full-stack and machine learning engineer</title>
  <defs>
    <linearGradient id="acch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridh" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .spin { transform-origin: 960px 165px; animation: spin 40s linear infinite; }
    .spin2 { transform-origin: 960px 165px; animation: spin 26s linear infinite reverse; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .rise { animation: rise .9s ease-out both; }
    .rise2 { animation: rise .9s .15s ease-out both; }
    .rise3 { animation: rise .9s .3s ease-out both; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .spin, .spin2, .blink, .rise, .rise2, .rise3 { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="18" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="1198" height="328" rx="18" fill="url(#gridh)" opacity="0.7"/>
  <circle cx="960" cy="165" r="230" fill="url(#glowh)"/>
  <rect x="1" y="1" width="1198" height="4" rx="2" fill="url(#acch)"/>

  <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8b949e" class="rise">
    <text x="64" y="78">~/lembachar <tspan fill="#22d3ee">$</tspan> whoami<tspan class="blink" fill="#22d3ee"> _</tspan></text>
  </g>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" class="rise2">
    <text x="62" y="148" font-size="58" font-weight="700" fill="#e6edf3" letter-spacing="-1">Imad Lembachar</text>
    <text x="64" y="192" font-size="22" fill="#8b949e">Full-stack engineer <tspan fill="url(#acch)" font-weight="600">&amp;</tspan> machine learning researcher</text>
  </g>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" class="rise3">
    <rect x="64" y="232" width="254" height="32" rx="16.0" fill="#1f2937" stroke="#30363d"/><text x="191.0" y="253.25" text-anchor="middle" fill="#c9d1d9" font-size="15">React · Django · PostgreSQL</text><rect x="328" y="232" width="238" height="32" rx="16.0" fill="#1f2937" stroke="#30363d"/><text x="447.0" y="253.25" text-anchor="middle" fill="#c9d1d9" font-size="15">PyTorch · Medical imaging</text><rect x="576" y="232" width="145" height="32" rx="16.0" fill="#1f2937" stroke="#30363d"/><text x="648.5" y="253.25" text-anchor="middle" fill="#c9d1d9" font-size="15">Chengdu, China</text>
  </g>

  <g class="spin"><circle cx="960" cy="165" r="70" fill="none" stroke="#30363d" stroke-dasharray="2 6" stroke-width="1"/><circle cx="960" cy="165" r="110" fill="none" stroke="#30363d" stroke-dasharray="1 0" stroke-width="1"/><circle cx="960" cy="165" r="150" fill="none" stroke="#30363d" stroke-dasharray="4 8" stroke-width="1"/>
    <circle cx="1070" cy="165" r="6" fill="#22d3ee"/>
    <circle cx="960" cy="15" r="4" fill="#818cf8"/>
  </g>
  <g class="spin2">
    <circle cx="890" cy="165" r="5" fill="#818cf8"/>
    <circle cx="960" cy="275" r="3.5" fill="#22d3ee"/>
  </g>
  <circle cx="960" cy="165" r="34" fill="#161b22" stroke="url(#acch)" stroke-width="2"/>
  <text x="960" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="700" fill="#e6edf3">IL</text>
</svg>
