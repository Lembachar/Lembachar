<svg xmlns="http://www.w3.org/2000/svg" width="580" height="330" viewBox="0 0 580 330" role="img" aria-label="Breast Cancer on EMBED - Research · team lead">
  <title>Breast Cancer on EMBED - Research · team lead</title>
  <defs>
    <linearGradient id="accc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
