<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Selected results: 50x faster API, 70% smaller bundle, 271 backend tests, 0.826 test AUC">
  <title>Selected results</title>
  <defs>
    <linearGradient id="accs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glows" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grids" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#eaeef2" stroke-width="1"/>
    </pattern>
  </defs>
  <style>.t0 { animation: up .7s 0.00s ease-out both; }.t1 { animation: up .7s 0.12s ease-out both; }.t2 { animation: up .7s 0.24s ease-out both; }.t3 { animation: up .7s 0.36s ease-out both; } @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { g { animation: none !important; } }</style>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <g class="t0">
    <rect x="0.5" y="0.5" width="287.0" height="149" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="24.0" y="66" font-size="44" font-weight="700" fill="url(#accs)" letter-spacing="-1">50×</text>
    <text x="24.0" y="100" font-size="16" fill="#1f2328">faster tenant-admin API</text>
    <text x="24.0" y="125" font-size="14" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" fill="#59636e">6–7 s → 117 ms</text>
  </g>
  <g class="t1">
    <rect x="304.5" y="0.5" width="287.0" height="149" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="328.0" y="66" font-size="44" font-weight="700" fill="url(#accs)" letter-spacing="-1">−70%</text>
    <text x="328.0" y="100" font-size="16" fill="#1f2328">JavaScript bundle size</text>
    <text x="328.0" y="125" font-size="14" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" fill="#59636e">501 KB → 152 KB</text>
  </g>
  <g class="t2">
    <rect x="608.5" y="0.5" width="287.0" height="149" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="632.0" y="66" font-size="44" font-weight="700" fill="url(#accs)" letter-spacing="-1">271</text>
    <text x="632.0" y="100" font-size="16" fill="#1f2328">backend tests written</text>
    <text x="632.0" y="125" font-size="14" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" fill="#59636e">up from 86</text>
  </g>
  <g class="t3">
    <rect x="912.5" y="0.5" width="287.0" height="149" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="936.0" y="66" font-size="44" font-weight="700" fill="url(#accs)" letter-spacing="-1">0.826</text>
    <text x="936.0" y="100" font-size="16" fill="#1f2328">test AUC, mammography</text>
    <text x="936.0" y="125" font-size="14" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" fill="#59636e">95% CI 0.779–0.872</text>
  </g>
  </g>
